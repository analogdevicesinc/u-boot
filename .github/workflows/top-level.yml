name: U-Boot CI

on:
  push:
    branches: [ "adi-xlnx-u-boot-2025.1-y" ]
  pull_request:

jobs:
  build_arm:
    uses: analogdevicesinc/u-boot/.github/workflows/build.yml@ci
    with:
      arch: arm
      defconfig: ${{ matrix.defconfig }}
    strategy:
      matrix:
        defconfig:
          - 'zynq_pluto_defconfig'
          - 'zynq_m2k_defconfig'
          - 'zynq_adrv9361_defconfig'
          - 'zynq_adrv9364_defconfig'
          - 'zynq_coraz7_defconfig'

  build_aarch64:
    uses: analogdevicesinc/u-boot/.github/workflows/build.yml@ci
    with:
      arch: arm64
      defconfig: ${{ matrix.defconfig }}
    strategy:
      matrix:
        defconfig:
          - 'adi_zynqmp_adrv9009_zu11eg_adrv2crr_fmc_defconfig'
          - 'zynqmp_jupiter_sdr_defconfig'
          - 'zynqmp_kv260_defconfig'

  checks:
    uses: analogdevicesinc/u-boot/.github/workflows/checks.yml@ci

  deploy_cloudsmith:
    needs: [build_arm, build_aarch64, checks]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    uses: analogdevicesinc/linux/.github/workflows/upload-to-cloudsmith.yml@ci
    secrets:
      CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    permissions:
      id-token: write
      contents: read
      actions: read
    with:
      artifacts: >
        *
