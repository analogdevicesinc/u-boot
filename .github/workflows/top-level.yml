name: U-Boot CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "adi-u-boot-2025.10.y" ]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_arm:
    uses: analogdevicesinc/u-boot/.github/workflows/build.yml@ci
    with:
      arch: arm
      defconfig: ${{ matrix.defconfig }}
    strategy:
      matrix:
        defconfig:
          - 'sc573-ezlite_defconfig'
          - 'sc584-ezkit_defconfig'
          - 'sc589-ezkit_defconfig'
          - 'sc589-mini_defconfig'
          - 'sc594-som-ezkit-spl_defconfig'
          - 'sc594-som-ezlite-spl_defconfig'

  build_aarch64:
    uses: analogdevicesinc/u-boot/.github/workflows/build.yml@ci
    with:
      arch: arm64
      defconfig: ${{ matrix.defconfig }}
    strategy:
      matrix:
        defconfig:
          - 'sc598-htol-spl_defconfig'
          - 'sc598-som-ezkit-spl_defconfig'
          - 'sc598-som-ezlite-spl_defconfig'
          - 'sc846-som_defconfig'
          - 'sc846-som-ezkit_defconfig'
          - 'xilinx_zynqmp_virt_defconfig'

  checks:
    uses: analogdevicesinc/u-boot/.github/workflows/checks.yml@ci

  hardware-test:
    needs: [build_aarch64]
    if: ${{ github.event_name != 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - needs: '["sc598", "ezkit"]'
          - needs: '["sc598", "ezlite"]'
          - needs: '["sc846", "ezkit"]'
    uses: analogdevicesinc/u-boot/.github/workflows/hw-test.yml@ci
    with:
      test-set: 'adsp/u-boot'
      needs: ${{ matrix.needs }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write

  deploy_cloudsmith:
    needs: [build_arm, build_aarch64, checks]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    uses: analogdevicesinc/linux/.github/workflows/upload-to-cloudsmith.yml@ci
    secrets:
      CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    permissions:
      id-token: write
      contents: read
      actions: read
    with:
      artifacts: >
        *
